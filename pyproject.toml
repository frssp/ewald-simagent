[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ewald-simagent"
version = "0.2.4"
description = "Open finished sim-agent calculations in EWALD by AiiDA PK: load(\"simagent:1234\")"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["ewald>=0.1"]

[project.optional-dependencies]
test = ["pytest"]

[project.entry-points."ewald.plugins"]
simagent = "ewald_simagent"

[project.entry-points."ewald.readers"]
simagent = "ewald_simagent.reader:SimAgentReader"

[project.entry-points."ewald.settings_pages"]
simagent = "ewald_simagent.settings_page:SimAgentSettings"

[project.entry-points."ewald.panels"]
simagent = "ewald_simagent.panel:sim_agent"

[project.entry-points."ewald.workflows"]
simagent = "ewald_simagent.source:SimAgentWorkflows"

[project.scripts]
ewald-simagent = "ewald_simagent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ewald_simagent = ["ewald-plugin.toml"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-select = ["I"]
